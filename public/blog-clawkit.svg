<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1813"/>
      <stop offset="1" stop-color="#2a1c11"/>
    </linearGradient>
    <linearGradient id="cstep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff7a3c"/>
      <stop offset="1" stop-color="#ed5a1a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="url(#cbg)"/>

  <text x="70" y="90" fill="#ffffff" font-size="26" font-weight="700" letter-spacing="3" opacity="0.9">ALBERT W.</text>
  <text x="70" y="200" fill="#ff8a4f" font-size="72" font-weight="800" letter-spacing="-1">ClawKit</text>
  <text x="72" y="248" fill="#ffffff" font-size="24" opacity="0.7">A setup wizard for OpenClaw knowledge bases</text>

  <!-- wizard progress: 5 steps -->
  <g>
    <line x1="200" y1="380" x2="840" y2="380" stroke="#ffffff" stroke-opacity="0.18" stroke-width="4"/>
    <line x1="200" y1="380" x2="520" y2="380" stroke="url(#cstep)" stroke-width="4"/>
    <g font-size="24" font-weight="800" text-anchor="middle">
      <!-- active steps 1-3 -->
      <circle cx="200" cy="380" r="28" fill="url(#cstep)"/>
      <text x="200" y="389" fill="#1c1813">1</text>
      <circle cx="360" cy="380" r="28" fill="url(#cstep)"/>
      <text x="360" y="389" fill="#1c1813">2</text>
      <circle cx="520" cy="380" r="28" fill="url(#cstep)"/>
      <text x="520" y="389" fill="#1c1813">3</text>
      <!-- upcoming steps 4-5 -->
      <circle cx="680" cy="380" r="28" fill="#241a12" stroke="#ed5a1a" stroke-width="2.5"/>
      <text x="680" y="389" fill="#ff8a4f">4</text>
      <circle cx="840" cy="380" r="28" fill="#241a12" stroke="#ed5a1a" stroke-width="2.5"/>
      <text x="840" y="389" fill="#ff8a4f">5</text>
    </g>
    <!-- output node -->
    <g transform="translate(960, 352)">
      <rect x="0" y="0" width="170" height="56" rx="12" fill="#ffffff" fill-opacity="0.06" stroke="#ed5a1a" stroke-width="2"/>
      <text x="85" y="35" fill="#ff8a4f" font-size="20" font-weight="700" text-anchor="middle">config.zip</text>
    </g>
    <path d="M872 380 H 952" stroke="#ed5a1a" stroke-width="3" fill="none" marker-end="url(#carr)"/>
    <defs>
      <marker id="carr" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
        <path d="M0 0 L7 3 L0 6 z" fill="#ed5a1a"/>
      </marker>
    </defs>
  </g>

  <text x="70" y="540" fill="#ffffff" font-size="20" opacity="0.55">React · TypeScript · Tailwind · RAG · Cloudflare</text>
</svg>
