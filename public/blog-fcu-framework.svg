<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600" font-family="Inter, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff7f1"/>
      <stop offset="1" stop-color="#ffe7d6"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0 0 L7 3 L0 6 z" fill="#ed5a1a"/>
    </marker>
    <filter id="ds" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#ed5a1a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="600" fill="url(#bg2)"/>

  <text x="70" y="86" fill="#b8430a" font-size="24" font-weight="700" letter-spacing="3">PRISVALIS</text>
  <text x="70" y="150" fill="#2a2320" font-size="46" font-weight="800">Design Patterns in Practice</text>
  <text x="70" y="186" fill="#6b5f57" font-size="21">State · Strategy · Factory · Template Method · Adapter · Observer</text>

  <!-- state machine -->
  <g font-size="20" font-weight="700" text-anchor="middle">
    <!-- nodes -->
    <g filter="url(#ds)">
      <rect x="70"  y="300" width="180" height="72" rx="14" fill="#ffffff" stroke="#ed5a1a" stroke-width="2.5"/>
      <rect x="340" y="300" width="180" height="72" rx="14" fill="#ffffff" stroke="#ed5a1a" stroke-width="2.5"/>
      <rect x="610" y="300" width="180" height="72" rx="14" fill="#ffffff" stroke="#ed5a1a" stroke-width="2.5"/>
      <rect x="880" y="300" width="180" height="72" rx="14" fill="#ed5a1a" stroke="#ed5a1a" stroke-width="2.5"/>
      <rect x="340" y="450" width="180" height="64" rx="14" fill="#ffffff" stroke="#c9c2bb" stroke-width="2.5"/>
    </g>
    <text x="160" y="343" fill="#2a2320">PENDING</text>
    <text x="430" y="343" fill="#2a2320">APPROVED</text>
    <text x="700" y="343" fill="#2a2320">IN USE</text>
    <text x="970" y="343" fill="#ffffff">RETURNED</text>
    <text x="430" y="489" fill="#8a8079">REJECTED</text>

    <!-- transitions -->
    <g stroke="#ed5a1a" stroke-width="2.5" fill="none">
      <line x1="250" y1="336" x2="335" y2="336" marker-end="url(#arrow)"/>
      <line x1="520" y1="336" x2="605" y2="336" marker-end="url(#arrow)"/>
      <line x1="790" y1="336" x2="875" y2="336" marker-end="url(#arrow)"/>
    </g>
    <path d="M160 372 L160 482 L335 482" stroke="#c9c2bb" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/>
  </g>
</svg>
